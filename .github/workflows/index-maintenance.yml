name: Index maintenance
on:
  push:
    branches: [main]
    paths: ['data/**', 'js/**', '.github/workflows/index-maintenance.yml']
  pull_request:
    paths: ['data/**', 'js/**', '.github/workflows/index-maintenance.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  validate-and-preserve-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run validate
      - name: Check forecast history is append-only
        env:
          FORECAST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify-forecast-history
      - run: npm run update-metadata
      - name: Commit generated metadata snapshot
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata.generated.json
          git diff --cached --quiet || git commit -m "chore: update index metadata"
          git push
