name: Research queue maintenance
on: { workflow_dispatch: {}, schedule: [{ cron: '23 5 * * *' }] }
permissions: { contents: write }
jobs:
  research-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate baseline data
        env: { NODE_BIN: node }
        run: python3 scripts/validate.py
      - name: Preserve historical forecasts
        env: { HISTORY_BASE_SHA: ${{ github.event.before }} }
        run: python3 scripts/verify_history.py
      - name: Build research queue
        run: node --input-type=module -e "import {researchQueue as q} from './data/research/queue.js';console.log(JSON.stringify(q));" > /tmp/queue.json
      - name: Discover due source updates
        run: node --input-type=module -e 'import {discover} from "./scripts/discover-sources.mjs"; discover().then(result => console.log(JSON.stringify(result)))' > /tmp/candidates.json
      - name: Store candidate update queue
        run: cp /tmp/candidates.json data/research/candidates.generated.json
      - name: Deterministic change check
        run: echo "research_mode=infrastructure_only; no evidence collection performed"
      - name: Ensure audit ledger directory exists
        run: mkdir -p data/ledger
      - name: Write audit summary
        run: python3 scripts/write_audit.py < /tmp/queue.json | tee "data/ledger/run-$(date -u +%Y%m%dT%H%M%SZ).json"
      - name: Validate again
        run: python3 scripts/validate.py
      - name: Commit audit record only when changed
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger; git diff --cached --quiet || (git commit -m "chore: record research queue run" && git push)
